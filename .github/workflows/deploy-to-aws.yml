name: Deploy to AWS ECS

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: groceries-guru
  ECS_SERVICE: groceries-guru-service
  ECS_CLUSTER: groceries-guru-cluster
  ECS_TASK_DEFINITION: groceries-guru
  CONTAINER_NAME: groceries-guru

jobs:
  build-and-push:
    name: Build, Test & Push
    runs-on: ubuntu-latest

    outputs:
      image-uri: ${{ steps.push-image.outputs.image }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🔨 Building Docker image..."
        docker build -t groceries-guru:$IMAGE_TAG .
        echo "✅ Docker image built successfully"

    - name: Test Docker image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "🧪 Testing Docker image..."
        # Test that the container starts successfully
        docker run --rm --entrypoint="" groceries-guru:$IMAGE_TAG node --version
        echo "✅ Docker image tested successfully"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag and push image to Amazon ECR
      id: push-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Tag the already-built image for ECR
        echo "🏷️ Tagging image for ECR..."
        docker tag groceries-guru:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag groceries-guru:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "📤 Pushing tested image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        echo "✅ Image pushed successfully: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: development
    needs: build-and-push
    # Deploy when code is pushed to dev branch (including PR merges)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Download task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ needs.build-and-push.outputs.image-uri }}

    - name: Run database migrations
      env:
        IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
      run: |
        echo "🗄️ Running database migrations..."
        
        # Create a temporary task definition for migrations
        MIGRATION_TASK_DEF=$(cat task-definition.json | jq --arg IMAGE "$IMAGE_URI" '
          {
            family: "groceries-guru-migration",
            taskRoleArn: .taskRoleArn,
            executionRoleArn: .executionRoleArn,
            networkMode: .networkMode,
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            containerDefinitions: [
              (.containerDefinitions[0] | {
                name: .name,
                image: $IMAGE,
                command: ["npm", "run", "db:migrate:run"],
                essential: .essential,
                logConfiguration: .logConfiguration,
                environment: .environment,
                secrets: .secrets,
                portMappings: [],
                healthCheck: (.healthCheck // null)
              })
            ]
          }
        ')
        
        # Register the migration task definition
        echo "$MIGRATION_TASK_DEF" > migration-task-definition.json
        aws ecs register-task-definition \
          --cli-input-json file://migration-task-definition.json \
          --region ${{ env.AWS_REGION }}
        
        # Get network configuration from existing service
        echo "Getting network configuration from existing service..."
        SERVICE_INFO=$(aws ecs describe-services \
          --cluster ${{ env.ECS_CLUSTER }} \
          --services ${{ env.ECS_SERVICE }} \
          --query 'services[0].networkConfiguration' \
          --region ${{ env.AWS_REGION }})
        
        # Run the migration task with network configuration
        echo "Starting migration task with network configuration..."
        TASK_ARN=$(aws ecs run-task \
          --cluster ${{ env.ECS_CLUSTER }} \
          --task-definition groceries-guru-migration \
          --network-configuration "$SERVICE_INFO" \
          --query 'tasks[0].taskArn' \
          --output text \
          --region ${{ env.AWS_REGION }})
        
        echo "Migration task ARN: $TASK_ARN"
        
        # Wait for migration task to complete
        echo "⏳ Waiting for migration to complete..."
        aws ecs wait tasks-stopped \
          --cluster ${{ env.ECS_CLUSTER }} \
          --tasks $TASK_ARN \
          --region ${{ env.AWS_REGION }}
        
        # Check migration exit code
        EXIT_CODE=$(aws ecs describe-tasks \
          --cluster ${{ env.ECS_CLUSTER }} \
          --tasks $TASK_ARN \
          --query 'tasks[0].containers[0].exitCode' \
          --output text \
          --region ${{ env.AWS_REGION }})
        
        if [ "$EXIT_CODE" != "0" ]; then
          echo "❌ Migration failed with exit code: $EXIT_CODE"
          
          # Get migration logs for debugging
          echo "📋 Migration logs:"
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name "/ecs/groceries-guru" \
            --order-by LastEventTime \
            --descending \
            --query 'logStreams[0].logStreamName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          if [ "$LOG_STREAM" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "/ecs/groceries-guru" \
              --log-stream-name "$LOG_STREAM" \
              --query 'events[].message' \
              --output text \
              --region ${{ env.AWS_REGION }}
          fi
          
          exit 1
        fi
        
        echo "✅ Database migrations completed successfully!"

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Deployment status
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🚀 Application is now running at: https://dev.groceriesguru.com"
        echo "📊 ECS Service: ${{ env.ECS_SERVICE }}"
        echo "🔧 ECS Cluster: ${{ env.ECS_CLUSTER }}"
        echo "📦 Image: ${{ needs.build-and-push.outputs.image-uri }}"