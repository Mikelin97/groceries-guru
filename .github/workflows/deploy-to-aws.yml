name: Deploy to AWS ECS

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: groceries-guru
  ECS_SERVICE: groceries-guru-service
  ECS_CLUSTER: groceries-guru-cluster
  ECS_TASK_DEFINITION: groceries-guru
  CONTAINER_NAME: groceries-guru

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build

    - name: Build Docker image (validation)
      run: |
        echo "🔍 Building Docker image for validation..."
        docker build -t groceries-guru:${{ github.sha }} .
        echo "✅ Docker image built successfully"

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    environment: development
    needs: build-and-test
    # Deploy when code is pushed to dev branch (including PR merges)
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build a docker container and push it to ECR
        echo "🚀 Building and pushing Docker image for deployment..."
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        echo "Pushing image to ECR..."
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Download task definition
      run: |
        aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ steps.build-image.outputs.image }}

    - name: Run database migrations
      env:
        IMAGE_URI: ${{ steps.build-image.outputs.image }}
      run: |
        echo "🗄️ Running database migrations..."
        
        # Create a temporary task definition for migrations
        MIGRATION_TASK_DEF=$(cat task-definition.json | jq --arg IMAGE "$IMAGE_URI" '
          {
            family: "groceries-guru-migration",
            taskRoleArn: .taskRoleArn,
            executionRoleArn: .executionRoleArn,
            networkMode: .networkMode,
            requiresCompatibilities: .requiresCompatibilities,
            cpu: .cpu,
            memory: .memory,
            containerDefinitions: [
              (.containerDefinitions[0] | {
                name: .name,
                image: $IMAGE,
                command: ["npm", "run", "db:migrate:run"],
                essential: .essential,
                logConfiguration: .logConfiguration,
                environment: .environment,
                secrets: .secrets,
                portMappings: [],
                healthCheck: (.healthCheck // null)
              })
            ]
          }
        ')
        
        # Register the migration task definition
        echo "$MIGRATION_TASK_DEF" > migration-task-definition.json
        aws ecs register-task-definition \
          --cli-input-json file://migration-task-definition.json \
          --region ${{ env.AWS_REGION }}
        
        # Run the migration task
        echo "Starting migration task..."
        TASK_ARN=$(aws ecs run-task \
          --cluster ${{ env.ECS_CLUSTER }} \
          --task-definition groceries-guru-migration \
          --query 'tasks[0].taskArn' \
          --output text \
          --region ${{ env.AWS_REGION }})
        
        echo "Migration task ARN: $TASK_ARN"
        
        # Wait for migration task to complete
        echo "⏳ Waiting for migration to complete..."
        aws ecs wait tasks-stopped \
          --cluster ${{ env.ECS_CLUSTER }} \
          --tasks $TASK_ARN \
          --region ${{ env.AWS_REGION }}
        
        # Check migration exit code
        EXIT_CODE=$(aws ecs describe-tasks \
          --cluster ${{ env.ECS_CLUSTER }} \
          --tasks $TASK_ARN \
          --query 'tasks[0].containers[0].exitCode' \
          --output text \
          --region ${{ env.AWS_REGION }})
        
        if [ "$EXIT_CODE" != "0" ]; then
          echo "❌ Migration failed with exit code: $EXIT_CODE"
          
          # Get migration logs for debugging
          echo "📋 Migration logs:"
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name "/ecs/groceries-guru" \
            --order-by LastEventTime \
            --descending \
            --query 'logStreams[0].logStreamName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          if [ "$LOG_STREAM" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "/ecs/groceries-guru" \
              --log-stream-name "$LOG_STREAM" \
              --query 'events[].message' \
              --output text \
              --region ${{ env.AWS_REGION }}
          fi
          
          exit 1
        fi
        
        echo "✅ Database migrations completed successfully!"

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

    - name: Deployment status
      run: |
        echo "🎉 Deployment completed successfully!"
        echo "🚀 Application is now running at: https://dev.groceriesguru.com"
        echo "📊 ECS Service: ${{ env.ECS_SERVICE }}"
        echo "🔧 ECS Cluster: ${{ env.ECS_CLUSTER }}"
        echo "📦 Image: ${{ steps.build-image.outputs.image }}"