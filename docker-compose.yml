
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.4-alpine
    container_name: groceries_guru_db
    environment:
      POSTGRES_DB: groceries_guru
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./lib/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groceries_guru"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - groceries_network


  # Redis for caching (optional but recommended)
  redis:
    container_name: groceries_guru_redis
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - groceries_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: groceries_guru_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/groceries_guru
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Alibaba Cloud Bailian Configuration
      - USE_CLOUD_VECTOR_DB=${USE_CLOUD_VECTOR_DB:-false}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      - ALIBABA_CLOUD_REGION=${ALIBABA_CLOUD_REGION:-cn-beijing}
      - BAILIAN_ENDPOINT=${BAILIAN_ENDPOINT:-bailian.cn-beijing.aliyuncs.com}
      - BAILIAN_WORKSPACE_ID=${BAILIAN_WORKSPACE_ID}
      - BAILIAN_INDEX_ID=${BAILIAN_INDEX_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - groceries_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  groceries_network:
    driver: bridge
